[project]
name = "quant-service-scaffold"
version = "1.0.0"
description = "A clean go-kratos style Python scaffold/boilerplate"
requires-python = ">=3.13"
dependencies = [
  "grpcio>=1.84.0,<2",
  "sqlalchemy>=2.0.52,<2.1",
  "greenlet>=3.5.6,<4",
  "alembic>=1.20.0,<2",
  "asyncpg>=0.31.0,<0.32",
  "protobuf==7.36.1",
  "googleapis-common-protos>=1.75.3,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
