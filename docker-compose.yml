services:
  postgres:
    image: postgres:18.6
    container_name: quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: quant
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker.
      # Use a new directory; existing PostgreSQL 16 data requires migration.
      - ./postgres-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d quant"]
      interval: 10s
      timeout: 5s
      retries: 5
