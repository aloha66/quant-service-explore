<style>

isplay:inline-block;padding:2px 8px;border-radius:4px;background:#e8eeed;color:#34565d;font-size:12px;font-weight:600}.badge.warning{background:#f9edda;color:var(--warning)}.rule{height:1px;background:var(--line);margin:20px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields .wide{grid-column:1/-1}.page{max-width:1360px;margin:auto;padding:28px 30px 70px}.intro{padding-bottom:24px}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);gap:26px}.rail{align-self:start;position:sticky;top:20px;padding-top:6px}.rail nav{display:grid;gap:6px;margin:18px 0 24px}.rail nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 4px}.rail nav a:hover{color:var(--accent)}.step-number{width:25px;height:25px;border:1px solid #9fb3b4;border-radius:50%;display:grid;place-content:center;font-size:12px}.rail-state{border-top:1px solid var(--line);padding-top:16px}.rail-state dl{display:grid;grid-template-columns:80px 1fr;gap:7px;margin:10px 0}.rail-state dt{color:var(--muted)}.rail-state dd{margin:0}.workspace{min-width:0}.section{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;padding:24px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}.state-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}.state-cell{padding:12px 15px 12px 0}.state-cell+.state-cell{border-left:1px solid var(--line);padding-left:15px}.state-cell strong{display:block}.notice{border:1px solid #9dbfb2;background:#eef7f2;padding:12px 16px;margin-bottom:16px;border-radius:6px}.notice.error{border-color:#d2ac83;background:#fcf4e8;color:#744b17}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button{flex:1;min-width:120px;text-align:left}.tabs span{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px} :12px;margin-top:12px}.method-row{border-bottom:1px solid var(--line);padding-bottom:12px}.method-row summary{cursor:pointer;font-weight:600}.method-row p{margin:8px 0;color:var(--muted)}details>summary{cursor:pointer}details summary:hover{color:var(--accent)}.record{border-top:1px solid var(--line);padding:15px 0}.record summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;list-style:revert}.record-copy{margin-top:14px;display:grid;gap:14px}.record-copy dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;margin:0}.record-copy dt{color:var(--muted)}.record-copy dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.guide{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}.guide ol{padding-left:22px;margin:12px 0}.guide li{padding:6px 0}.guide li button{margin-right:10px}.footnote{margin-top:8px}.empty{padding:22px;background:#f6f8f7;color:var(--muted)}.feedback-table td:last-child{white-space:normal}.feedback-table td{font-variant-numeric:tabular-nums}.edit-note{font-size:12px;color:var(--warning);margin-top:8px}.visually-hidden{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}body::-webkit-scrollbar{width:10px}body::-webkit-scrollbar-thumb{background:#9aadaa;border:2px solid var(--ground);border-radius:6px}
